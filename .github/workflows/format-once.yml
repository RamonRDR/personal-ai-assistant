name: Temporary one-time Ruff formatting
on:
  push:
    branches: [feat/personal-ai-assistant-v1]
    paths: [.github/workflows/format-once.yml]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/personal-ai-assistant-v1
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: python -m pip install ruff
      - run: |
          ruff check --fix src tests scripts
          ruff format src tests scripts
      - name: Commit formatting to feature branch only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src tests scripts
          if ! git diff --cached --quiet; then
            git commit -m "style: apply automated Ruff fixes and formatting"
            git push origin HEAD:feat/personal-ai-assistant-v1
          fi
